<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>cccxa</title>
<style>
  /* ---- shadcn/ui design tokens ---- */
  :root {
    --background: 0 0% 100%;
    --foreground: 240 10% 3.9%;
    --card: 0 0% 100%;
    --card-foreground: 240 10% 3.9%;
    --muted: 240 4.8% 95.9%;
    --muted-foreground: 240 3.8% 46.1%;
    --primary: 240 5.9% 10%;
    --primary-foreground: 0 0% 98%;
    --secondary: 240 4.8% 95.9%;
    --secondary-foreground: 240 5.9% 10%;
    --accent: 240 4.8% 95.9%;
    --border: 240 5.9% 90%;
    --input: 240 5.9% 90%;
    --ring: 240 5.9% 10%;
    --chart: 221 83% 53%;
    --incog: 262 68% 58%;
    --radius: 0.6rem;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    html:not([data-theme]) {
      --background: 240 10% 3.9%; --foreground: 0 0% 98%;
      --card: 240 10% 5.5%; --card-foreground: 0 0% 98%;
      --muted: 240 3.7% 15.9%; --muted-foreground: 240 5% 64.9%;
      --primary: 0 0% 98%; --primary-foreground: 240 5.9% 10%;
      --secondary: 240 3.7% 15.9%; --secondary-foreground: 0 0% 98%;
      --accent: 240 3.7% 17%; --border: 240 3.7% 16%; --input: 240 3.7% 18%;
      --ring: 240 4.9% 83.9%; --chart: 217 91% 60%; --incog: 262 83% 72%;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --background: 240 10% 3.9%; --foreground: 0 0% 98%;
    --card: 240 10% 5.5%; --card-foreground: 0 0% 98%;
    --muted: 240 3.7% 15.9%; --muted-foreground: 240 5% 64.9%;
    --primary: 0 0% 98%; --primary-foreground: 240 5.9% 10%;
    --secondary: 240 3.7% 15.9%; --secondary-foreground: 0 0% 98%;
    --accent: 240 3.7% 17%; --border: 240 3.7% 16%; --input: 240 3.7% 18%;
    --ring: 240 4.9% 83.9%; --chart: 217 91% 60%; --incog: 262 83% 72%;
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: hsl(var(--background)); color: hsl(var(--foreground));
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", "Noto Sans Hebrew", Arial, sans-serif;
    font-size: 14px; line-height: 1.5; -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 1200px; margin: 0 auto; padding: 22px 20px 72px; }
  .muted { color: hsl(var(--muted-foreground)); }
  .tnum { font-variant-numeric: tabular-nums; }

  /* header */
  header.top { display: flex; align-items: center; gap: 10px 14px; flex-wrap: wrap; margin-bottom: 18px; }
  header.top .title { font-size: 18px; font-weight: 650; letter-spacing: -0.01em; }
  header.top .sub { font-size: 12px; }
  header.top .spacer { flex: 1; }

  .chip { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 550;
    color: hsl(var(--secondary-foreground)); background: hsl(var(--secondary));
    border: 1px solid hsl(var(--border)); border-radius: 999px; padding: 4px 11px; }

  /* controls */
  button, select, input, textarea { font-family: inherit; font-size: 14px; color: inherit; }
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; cursor: pointer;
    border-radius: calc(var(--radius) - 0.2rem); border: 1px solid transparent; padding: 7px 12px;
    font-weight: 550; transition: background .12s, border-color .12s, opacity .12s; white-space: nowrap; }
  .btn-outline { background: transparent; border-color: hsl(var(--border)); color: hsl(var(--foreground)); }
  .btn-outline:hover { background: hsl(var(--accent)); }
  .btn-primary { background: hsl(var(--primary)); color: hsl(var(--primary-foreground)); }
  .btn-primary:hover { opacity: .9; }
  .btn-sm { padding: 5px 10px; font-size: 13px; }
  .btn:disabled { opacity: .5; cursor: default; }
  .icon-btn { width: 34px; height: 34px; padding: 0; }

  select, input[type=text], input[type=number], textarea {
    background: hsl(var(--background)); border: 1px solid hsl(var(--input));
    border-radius: calc(var(--radius) - 0.2rem); padding: 7px 10px; outline: none; width: 100%;
  }
  select { cursor: pointer; width: auto; }
  input:focus, textarea:focus, select:focus { border-color: hsl(var(--ring));
    box-shadow: 0 0 0 3px hsl(var(--ring) / .15); }
  textarea { resize: vertical; min-height: 74px; line-height: 1.6; }

  /* switch */
  .switch { position: relative; display: inline-block; width: 40px; height: 23px; flex: none; }
  .switch input { opacity: 0; width: 0; height: 0; }
  .switch .slider { position: absolute; inset: 0; background: hsl(var(--input)); border-radius: 999px; transition: .15s; }
  .switch .slider::before { content: ""; position: absolute; height: 17px; width: 17px; left: 3px; top: 3px;
    background: #fff; border-radius: 50%; transition: .15s; box-shadow: 0 1px 2px rgba(0,0,0,.25); }
  .switch input:checked + .slider { background: hsl(var(--chart)); }
  .switch input:checked + .slider::before { transform: translateX(17px); }

  /* tabs */
  .tabs { display: inline-flex; background: hsl(var(--muted)); border-radius: calc(var(--radius) - 0.15rem);
    padding: 3px; gap: 3px; }
  .tab { border: none; background: transparent; color: hsl(var(--muted-foreground)); cursor: pointer;
    padding: 6px 14px; border-radius: calc(var(--radius) - 0.28rem); font-weight: 550; font-size: 13px; }
  .tab[aria-selected="true"] { background: hsl(var(--background)); color: hsl(var(--foreground));
    box-shadow: 0 1px 2px rgba(0,0,0,.08); }

  /* card */
  .card { background: hsl(var(--card)); color: hsl(var(--card-foreground));
    border: 1px solid hsl(var(--border)); border-radius: var(--radius); padding: 16px 18px; margin-bottom: 16px; }
  .card h2 { font-size: 14px; margin: 0 0 14px; font-weight: 620; display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
  .card h2 .hint { font-weight: 400; font-size: 12px; color: hsl(var(--muted-foreground)); }

  /* tiles */
  .tiles { display: grid; grid-template-columns: repeat(6, 1fr); gap: 12px; margin-bottom: 18px; }
  @media (max-width: 900px) { .tiles { grid-template-columns: repeat(3, 1fr); } }
  @media (max-width: 520px) { .tiles { grid-template-columns: repeat(2, 1fr); } }
  .tile { background: hsl(var(--card)); border: 1px solid hsl(var(--border)); border-radius: var(--radius); padding: 14px 15px; }
  .tile .k { font-size: 12px; color: hsl(var(--muted-foreground)); margin-bottom: 6px; }
  .tile .v { font-size: 25px; font-weight: 680; letter-spacing: -0.02em; }

  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  @media (max-width: 900px) { .grid2 { grid-template-columns: 1fr; } }

  /* bars */
  .hbar { display: grid; grid-template-columns: 150px 1fr auto; align-items: center; gap: 10px; margin: 7px 0; }
  .hbar .lbl { font-size: 13px; color: hsl(var(--foreground)); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; direction: ltr; text-align: start; }
  .hbar .track { background: hsl(var(--muted)); border-radius: 6px; height: 16px; overflow: hidden; }
  .hbar .fill { height: 100%; background: hsl(var(--chart)); border-radius: 6px; min-width: 3px; }
  .hbar .num { font-size: 12px; color: hsl(var(--muted-foreground)); min-width: 34px; text-align: start; }

  .hours { display: grid; grid-template-columns: repeat(24, 1fr); gap: 3px; align-items: end; height: 148px; }
  .hours .col { display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%; }
  .hours .bar { width: 100%; background: hsl(var(--chart)); border-radius: 4px 4px 0 0; min-height: 2px; }
  .hours .hl { font-size: 9px; color: hsl(var(--muted-foreground)); margin-top: 4px; }

  /* table */
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: start; padding: 8px 10px; border-bottom: 1px solid hsl(var(--border)); vertical-align: top; }
  th { color: hsl(var(--muted-foreground)); font-weight: 550; font-size: 12px; position: sticky; top: 0;
    background: hsl(var(--card)); z-index: 1; }
  tr:last-child td { border-bottom: none; }
  td.time { color: hsl(var(--muted-foreground)); white-space: nowrap; }
  td.url a { color: hsl(var(--chart)); text-decoration: none; direction: ltr; display: inline-block; }
  td.url a:hover { text-decoration: underline; }
  td.ltr { direction: ltr; }
  .scroll { max-height: 430px; overflow: auto; border: 1px solid hsl(var(--border)); border-radius: calc(var(--radius) - 0.15rem); }

  .toolbar { display: flex; margin-bottom: 10px; }
  .toolbar input { max-width: 320px; }
  .pager { display: flex; align-items: center; gap: 10px; margin-top: 10px; font-size: 12px; color: hsl(var(--muted-foreground)); }

  .badge { display: inline-block; font-size: 11px; padding: 2px 8px; border-radius: 999px; font-weight: 600; white-space: nowrap;
    background: hsl(var(--incog) / .15); color: hsl(var(--incog)); border: 1px solid hsl(var(--incog) / .4); }

  .gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
  .gallery figure { margin: 0; background: hsl(var(--muted)); border: 1px solid hsl(var(--border)); border-radius: calc(var(--radius) - 0.15rem); overflow: hidden; }
  .gallery img { width: 100%; height: 96px; object-fit: cover; display: block; }
  .gallery figcaption { font-size: 11px; color: hsl(var(--muted-foreground)); padding: 5px 7px; }

  .empty { color: hsl(var(--muted-foreground)); padding: 12px; }
  .note { color: hsl(var(--muted-foreground)); font-size: 12px; margin-top: 8px; }
  [hidden] { display: none !important; }

  /* settings */
  .set-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px 22px; }
  @media (max-width: 700px) { .set-grid { grid-template-columns: 1fr; } }
  .field { display: flex; flex-direction: column; gap: 5px; }
  .field.row { flex-direction: row; align-items: center; justify-content: space-between; }
  .field label { font-size: 13px; font-weight: 500; }
  .field .desc { font-size: 11px; color: hsl(var(--muted-foreground)); }
  .save-bar { display: flex; align-items: center; gap: 12px; margin-top: 6px; }
  .save-msg { font-size: 13px; }
  .save-msg.ok { color: hsl(142 71% 42%); }
  .save-msg.err { color: hsl(0 72% 51%); }

  /* user picker */
  .userpick { grid-column: 1 / -1; }
  .userpick .pickhint { font-size: 11px; color: hsl(var(--muted-foreground)); margin-bottom: 8px; }
  .userlist { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 6px 12px; margin-bottom: 10px; }
  .userchk { display: flex; align-items: center; gap: 8px; font-size: 13px; cursor: pointer;
    border: 1px solid hsl(var(--border)); border-radius: calc(var(--radius) - 0.25rem); padding: 6px 10px; }
  .userchk input { width: 16px; height: 16px; flex: none; accent-color: hsl(var(--chart)); cursor: pointer; }
  .userchk span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; direction: ltr; text-align: start; }
  .userchk.custom { border-style: dashed; }
  .useradd { display: flex; gap: 8px; align-items: center; }
  .useradd input { max-width: 240px; }
  .pwrow { grid-column: 1 / -1; }
  .pwstate { font-size: 12px; }
  .pwstate.set { color: hsl(142 71% 42%); }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div>
      <div class="title">cccxa</div>
      <div class="sub muted" id="genAt"></div>
    </div>
    <span class="chip" id="currentUser" hidden></span>
    <div class="spacer"></div>

    <div class="tabs" role="tablist">
      <button class="tab" id="tabDash" role="tab" aria-selected="true" data-i18n="tabDashboard"></button>
      <button class="tab" id="tabSet" role="tab" aria-selected="false" data-i18n="tabSettings"></button>
    </div>

    <span class="chip" id="userSelLbl" hidden></span>
    <select id="userSel" hidden></select>
    <button class="btn btn-outline btn-sm" id="langBtn" title="language"></button>
    <button class="btn btn-outline icon-btn" id="themeBtn" title="theme">◐</button>
  </header>

  <!-- ============ DASHBOARD ============ -->
  <section id="panelDash">
    <div class="tiles" id="tiles"></div>

    <div class="card">
      <h2><span data-i18n="hoursTitle"></span> <span class="hint" data-i18n="hoursHint"></span></h2>
      <div class="hours" id="hours"></div>
    </div>

    <div class="grid2">
      <div class="card">
        <h2><span data-i18n="topSites"></span> <span class="hint" data-i18n="topSitesHint"></span></h2>
        <div id="topSites"></div>
      </div>
      <div class="card">
        <h2><span data-i18n="topApps"></span> <span class="hint" data-i18n="topAppsHint"></span></h2>
        <div id="topApps"></div>
      </div>
    </div>

    <div class="card">
      <h2><span data-i18n="browsingTitle"></span> <span class="hint" id="browsingCount"></span></h2>
      <div class="toolbar"><input type="text" id="browsingSearch" data-i18n-ph="searchBrowsing"></div>
      <div class="scroll"><table id="browsingTbl"><thead><tr>
        <th style="width:104px" data-i18n="colTime"></th>
        <th style="width:86px" data-i18n="colBrowser"></th>
        <th style="width:60px" data-i18n="colMode"></th>
        <th data-i18n="colTitle"></th>
        <th data-i18n="colUrl"></th>
      </tr></thead><tbody></tbody></table></div>
      <div class="pager"><button class="btn btn-outline btn-sm" id="browsingPrev" data-i18n="prev"></button><span id="browsingInfo"></span><button class="btn btn-outline btn-sm" id="browsingNext" data-i18n="next"></button></div>
    </div>

    <div class="card">
      <h2><span data-i18n="programsTitle"></span> <span class="hint" id="programsCount"></span></h2>
      <div class="toolbar"><input type="text" id="programsSearch" data-i18n-ph="searchPrograms"></div>
      <div class="scroll"><table id="programsTbl"><thead><tr>
        <th style="width:104px" data-i18n="colTime"></th>
        <th style="width:160px" data-i18n="colApp"></th>
        <th data-i18n="colWindow"></th>
      </tr></thead><tbody></tbody></table></div>
      <div class="pager"><button class="btn btn-outline btn-sm" id="programsPrev" data-i18n="prev"></button><span id="programsInfo"></span><button class="btn btn-outline btn-sm" id="programsNext" data-i18n="next"></button></div>
    </div>

    <div class="card">
      <h2><span data-i18n="filesTitle"></span> <span class="hint" id="filesCount"></span></h2>
      <div class="toolbar"><input type="text" id="filesSearch" data-i18n-ph="searchFiles"></div>
      <div class="scroll"><table id="filesTbl"><thead><tr>
        <th style="width:104px" data-i18n="colTime"></th>
        <th style="width:220px" data-i18n="colName"></th>
        <th data-i18n="colPath"></th>
      </tr></thead><tbody></tbody></table></div>
      <div class="pager"><button class="btn btn-outline btn-sm" id="filesPrev" data-i18n="prev"></button><span id="filesInfo"></span><button class="btn btn-outline btn-sm" id="filesNext" data-i18n="next"></button></div>
    </div>

    <div class="card">
      <h2><span data-i18n="screenshotsTitle"></span> <span class="hint" id="shotsCount"></span></h2>
      <div class="gallery" id="gallery"></div>
      <div class="pager"><button class="btn btn-outline btn-sm" id="shotsPrev" data-i18n="prev"></button><span id="shotsInfo"></span><button class="btn btn-outline btn-sm" id="shotsNext" data-i18n="next"></button></div>
      <div class="note" id="galleryNote"></div>
    </div>
  </section>

  <!-- ============ SETTINGS ============ -->
  <section id="panelSet" hidden>
    <div class="card">
      <h2><span data-i18n="tabSettings"></span> <span class="hint" data-i18n="settingsHint"></span></h2>
      <div id="settingsForm"></div>
      <div class="save-bar">
        <button class="btn btn-primary" id="saveBtn" data-i18n="save"></button>
        <span class="save-msg" id="saveMsg"></span>
      </div>
      <div class="note" id="settingsStaticNote" hidden data-i18n="settingsStatic"></div>
    </div>
  </section>
</div>

<script id="cccxa-data" type="application/json">__CCCXA_DATA__</script>
<script id="cccxa-settings" type="application/json">__CCCXA_SETTINGS__</script>

  /* ---------------- paginated table ---------------- */
  function wireTable(prefix, rowHtml, searchText, pageSize) {
    var tbody = document.querySelector('#' + prefix + 'Tbl tbody');
    var info = document.getElementById(prefix + 'Info');
    var search = document.getElementById(prefix + 'Search');
    var prev = document.getElementById(prefix + 'Prev');
    var next = document.getElementById(prefix + 'Next');
    var rows = [], q = '', page = 0, PS = pageSize || 100;
    function filtered() { return q ? rows.filter(function (r) { return searchText(r).toLowerCase().indexOf(q) !== -1; }) : rows; }
    function draw() {
      var f = filtered(), pages = Math.max(1, Math.ceil(f.length / PS));
      page = Math.min(Math.max(0, page), pages - 1);
      var s = page * PS, pr = f.slice(s, s + PS);
      tbody.innerHTML = pr.length ? pr.map(rowHtml).join('') : '<tr><td colspan="9" class="empty">' + t('empty') + '</td></tr>';
      info.textContent = (f.length ? (s + 1) : 0) + '-' + Math.min(f.length, s + PS) + ' ' + t('of') + ' ' + f.length.toLocaleString(locale());
      prev.disabled = page <= 0; next.disabled = page >= pages - 1;
    }
    if (search) search.addEventListener('input', function () { q = search.value.trim().toLowerCase(); page = 0; draw(); });
    prev.addEventListener('click', function () { page--; draw(); });
    next.addEventListener('click', function () { page++; draw(); });
    return { set: function (r) { rows = r || []; q = ''; if (search) search.value = ''; page = 0; draw(); }, redraw: draw };
  }

    var next = document.getElementById(prefix + 'Next');

    function draw() {
      var pages = Math.max(1, Math.ceil(rows.length / PS));
      page = Math.min(Math.max(0, page), pages - 1);
      var s = page * PS, pr = rows.slice(s, s + PS);

  function collectSettings() {
    var out = JSON.parse(JSON.stringify(settings || {}));
    delete out.HasPassword; // דגל תצוגה בלבד, אינו הגדרה נשמרת
    SCHEMA.forEach(function (sec) {
      sec.fields.forEach(function (f) {
        var val;
        if (f.type === 'users') {
          var boxes = document.querySelectorAll('input[data-userfield="' + fieldId(f.k) + '"]:checked');
          val = Array.prototype.map.call(boxes, function (x) { return x.value; });
        } else {
          var el = document.getElementById(fieldId(f.k));
          if (!el) return;
          if (f.type === 'bool') val = el.checked;
          else if (f.type === 'int') val = el.value === '' ? 0 : parseInt(el.value, 10);
          else if (f.type === 'float') val = el.value === '' ? 0 : parseFloat(el.value);
          else if (f.type === 'list') val = el.value.split(/\r?\n/).map(function (s) { return s.trim(); }).filter(Boolean);
          else val = el.value;
        }
        // set nested path
        var parts = f.k.split('.'), o = out;
        for (var i = 0; i < parts.length - 1; i++) { if (o[parts[i]] == null || typeof o[parts[i]] !== 'object') o[parts[i]] = {}; o = o[parts[i]]; }
        o[parts[parts.length - 1]] = val;
      });
    });
    return out;
  }

    var pwConf = (document.getElementById('set_pw_confirm') || {}).value || '';
    var pwClear = !!(document.getElementById('set_pw_clear') || {}).checked;
    if (!pwClear && pwNew && pwNew !== pwConf) {
      msg.className = 'save-msg err'; msg.textContent = t('pwMismatch'); return;
    }
    if (pwClear) payload._clearPassword = true;
    else if (pwNew) payload._newPassword = pwNew;

    fetch('/api/settings', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) })
      .then(function (r) { return r.json(); })
      .then(function (res) {
        if (res.ok) {
          delete payload._newPassword; delete payload._clearPassword;
          payload.HasPassword = pwClear ? false : (pwNew ? true : !!settings.HasPassword);
          settings = payload;
          buildSettingsForm(); // מרענן מצב סיסמה ומנקה את שדות הסיסמה
          msg.className = 'save-msg ok'; msg.textContent = t('saved');
        } else { msg.className = 'save-msg err'; msg.textContent = t('saveErr') + (res.error || ''); }
      })
      .catch(function (e) { msg.className = 'save-msg err'; msg.textContent = t('saveErr') + e; });
  });

  /* ---------------- live-mode heartbeat & shutdown ---------------- */
  if (SERVED) {
    setInterval(function () { fetch('/api/ping', { method: 'POST' }).catch(function () {}); }, 15000);
    var bye = function () { try { navigator.sendBeacon('/api/shutdown'); } catch (e) {} };
    window.addEventListener('pagehide', bye);
    window.addEventListener('beforeunload', bye);
  }

  /* ---------------- boot ---------------- */
  document.getElementById('genAt').textContent = data.generatedAt ? (I18N[lang].updated + ': ' + fmt(data.generatedAt)) : '';
  applyLang();

  // רשימת משתמשי המחשב לבורר בשדות הסינון (רק בדשבורד החי); מרעננים את הטופס בהגעה.
  if (SERVED) {
    fetch('/api/users').then(function (r) { return r.json(); }).then(function (list) {
      if (Array.isArray(list) && list.length) { machineUsers = list; buildSettingsForm(); }
    }).catch(function () {});
  }

  if (data.users.length === 0) {
    document.getElementById('tiles').innerHTML = '<div class="tile"><div class="k">' + t('noData') + '</div><div class="v">-</div></div>';
  } else {
    render(data.users[0]);
  }
  // genAt depends on lang; refresh after applyLang
  document.getElementById('genAt').textContent = data.generatedAt ? (t('updated') + ': ' + fmt(data.generatedAt)) : '';
})();
</script>
</body>
</html>
